apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-recommendation
  namespace: music-app
  labels:
    app: music-recommendation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: music-recommendation
  template:
    metadata:
      labels:
        app: music-recommendation
    spec:
      containers:
        - name: music-recommendation
          image: iamruparc/music-recommendation:v1.45
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5

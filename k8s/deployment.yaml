apiVersion: v1
kind: Namespace
metadata:
  name: music-recommendation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-recommendation
  namespace: music-recommendation
  labels:
    app: music-recommendation
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: music-recommendation
  template:
    metadata:
      labels:
        app: music-recommendation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
    spec:
      serviceAccountName: music-recommendation
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: music-recommendation
        image: docker.io/rup-arc/music-recommendation-sys:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: music-recommendation-config
        - name: LOG_STREAM
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: AWS_ROLE_ARN
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['iam.amazonaws.com/role']
        - name: AWS_WEB_IDENTITY_TOKEN_FILE
          value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-run
          mountPath: /var/run
      volumes:
      - name: tmp
        emptyDir: {}
      - name: var-run
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - music-recommendation
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: music-recommendation
  namespace: music-recommendation
  labels:
    app: music-recommendation
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 5000
    protocol: TCP
  selector:
    app: music-recommendation

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: music-recommendation
  namespace: music-recommendation
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: music-recommendation
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: music-recommendation
  namespace: music-recommendation
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/music-recommendation-role

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: music-recommendation
  namespace: music-recommendation
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: music-recommendation
  namespace: music-recommendation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: music-recommendation
subjects:
- kind: ServiceAccount
  name: music-recommendation
  namespace: music-recommendation

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: music-recommendation-config
  namespace: music-recommendation
data:
  LOG_GROUP: "/ecs/music-recommendation"
  AWS_REGION: "us-east-1"
  FLASK_ENV: "production"

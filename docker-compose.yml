version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins-music-app
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JENKINS_OPTS=--httpPort=8080
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker  # Fixed: direct path instead of $(which docker)
    networks:
      - jenkins-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # PostgreSQL for Jenkins data storage (optional)
  postgres:
    image: postgres:15-alpine
    container_name: jenkins-db
    environment:
      POSTGRES_USER: jenkins
      POSTGRES_PASSWORD: jenkins_password
      POSTGRES_DB: jenkins_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jenkins-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jenkins -d jenkins_db"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  jenkins_home:
    driver: local
  postgres_data:
    driver: local

networks:
  jenkins-network:
    driver: bridge